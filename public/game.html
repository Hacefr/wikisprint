<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>WikiSprint — Racing...</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    /* Prevent mobile tap highlights & force touch context security */
    * {
      -webkit-tap-highlight-color: transparent;
    }
    #wiki-body {
      -webkit-touch-callout: none; /* Disables iOS long-press preview / open in tab */
      user-select: text;
    }
    #wiki-body a { 
      color: #3366cc; 
      text-decoration: none; 
      cursor: pointer;
      display: inline-block;
      padding: 1px 0; /* Slightly larger tap area for fingers */
    }
    #wiki-body a:active { text-decoration: underline; background-color: rgba(51, 102, 204, 0.1); }
    #wiki-body a.disabled-link { color: inherit !important; text-decoration: none !important; cursor: default !important; pointer-events: none; }
    
    /* Responsive Wikipedia Content */
    #wiki-body p { margin-bottom: 0.85rem; line-height: 1.6; font-size: 15px; }
    #wiki-body h2 { font-family: Georgia, serif; font-size: 1.25rem; border-bottom: 1px solid #c8ccd1; margin-top: 1.3rem; margin-bottom: 0.4rem; font-weight: normal; }
    #wiki-body h3 { font-family: Georgia, serif; font-size: 1.05rem; margin-top: 1rem; margin-bottom: 0.3rem; }
    #wiki-body ul { list-style-type: disc; margin-left: 1.25rem; margin-bottom: 0.8rem; }
    
    /* Mobile-scrollable tables and infoboxes */
    #wiki-body table, #wiki-body .infobox {
      max-width: 100% !important;
      display: block !important;
      overflow-x: auto !important;
      border: 1px solid #a2a9b1;
      margin-bottom: 1rem;
      font-size: 0.8rem;
    }
    #wiki-body img {
      max-width: 100% !important;
      height: auto !important;
    }
  </style>
</head>
<body class="bg-[#f8f9fa] text-[#202122] min-h-screen flex flex-col font-sans select-none">

  <!-- Mobile HUD (Compact 2-Row / Sticky) -->
  <header class="sticky top-0 z-40 bg-white border-b border-[#a2a9b1] px-3 py-1.5 text-xs shadow-sm flex flex-col gap-1">
    
    <!-- Row 1: Target Mission -->
    <div class="flex items-center justify-between gap-2">
      <div class="flex items-center gap-1 min-w-0">
        <span class="font-bold text-[#54595d] uppercase text-[10px] shrink-0">GOAL:</span>
        <span id="hud-target" class="font-serif text-xs sm:text-sm font-bold text-[#3366cc] truncate"></span>
      </div>
      <span id="hud-rule-badge" class="shrink-0 text-[10px] font-bold bg-[#eaecf0] px-1.5 py-0.5 rounded-sm text-[#54595d]"></span>
    </div>

    <!-- Row 2: Live Counters & Opponents -->
    <div class="flex items-center justify-between font-mono text-[11px] pt-0.5 border-t border-gray-100">
      <div class="flex items-center gap-3">
        <div>CLICKS: <b id="hud-clicks" class="text-xs">0</b></div>
        <div>TIME: <b id="hud-timer" class="text-xs">00:00</b></div>
      </div>
      <div id="hud-opponents" class="hidden flex items-center gap-1.5 overflow-hidden">
        <span class="text-[#54595d] text-[10px]">Opponent:</span>
        <div id="opponents-ticker" class="truncate max-w-[130px]"></div>
      </div>
    </div>
  </header>

  <!-- Article View Area -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-3.5 sm:p-8 bg-white border-x border-[#c8ccd1] my-2 sm:my-4">
    <h1 id="article-header" class="font-serif text-xl sm:text-3xl pb-2 border-b border-[#c8ccd1] mb-3">Loading entry...</h1>
    <div id="wiki-body"></div>
  </main>

  <!-- VICTORY MODAL -->
  <div id="win-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-3.5 hidden">
    <div class="bg-white border border-[#a2a9b1] max-w-xs sm:max-w-md w-full p-5 text-center shadow-2xl">
      <span class="text-3xl block mb-1">🏆</span>
      <h2 id="win-title" class="font-serif text-xl font-bold mb-1">Target Reached!</h2>
      <p class="text-xs text-[#54595d] mb-3">Course completed successfully.</p>

      <div class="grid grid-cols-2 gap-2 text-xs border border-[#c8ccd1] p-2.5 mb-3 font-mono">
        <div>CLICKS: <b id="win-clicks">0</b></div>
        <div>TIME: <b id="win-time">00:00</b></div>
      </div>

      <div id="multiplayer-standings" class="hidden mb-3 border border-[#c8ccd1] text-xs text-left max-h-32 overflow-y-auto">
        <div class="bg-[#eaecf0] px-2 py-1 font-bold">Standings</div>
        <div id="standings-rows" class="p-2 space-y-1 font-mono text-[11px]"></div>
      </div>

      <div id="win-exp-tag" class="bg-emerald-50 text-emerald-700 border border-emerald-300 text-xs font-bold py-1 mb-3">
        +250 EXP Gained!
      </div>

      <button onclick="window.location.href='/'" class="w-full bg-[#3366cc] text-white text-xs font-semibold py-2 rounded-sm cursor-pointer">
        Return to Lobby
      </button>
    </div>
  </div>

  <script>
    const socket = io();
    const params = new URLSearchParams(window.location.search);
    const mode = params.get('mode') || 'daily';
    let currentArticle = params.get('start') || 'The_Great_Barrier_Reef';
    const targetArticle = params.get('target') || 'Quantum_computing';
    const roomId = params.get('room');

    const winCondition = params.get('winCondition') || 'BOTH';
    const banNewTabs = params.get('newTabs') !== 'false';
    const banCtrlF = params.get('ctrlF') !== 'false';
    const banTabSwitch = params.get('tabSwitch') !== 'false';

    let clicks = 0;
    let secondsElapsed = 0;
    let timer = null;
    let route = [currentArticle];

    document.getElementById('hud-target').innerText = decodeURIComponent(targetArticle).replace(/_/g, ' ');
    document.getElementById('hud-rule-badge').innerText = 
      winCondition === 'TIME' ? 'Speedrun' : winCondition === 'STEPS' ? 'Fewest Clicks' : 'Clicks + Time';

    function startTimer() {
      timer = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('hud-timer').innerText = `${mins}:${secs}`;
      }, 1000);
    }

    async function fetchArticle(title) {
      document.getElementById('article-header').innerText = decodeURIComponent(title).replace(/_/g, ' ');
      const container = document.getElementById('wiki-body');
      container.innerHTML = "<p class='italic text-gray-500'>Querying Wikimedia API...</p>";

      try {
        const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/html/${encodeURIComponent(title)}`);
        const html = await res.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');

        doc.querySelectorAll('.mw-ref, .reference, .noprint, style, script, link').forEach(el => el.remove());

        doc.querySelectorAll('a').forEach(anchor => {
          const href = anchor.getAttribute('href');
          if (href && href.startsWith('./') && !href.includes(':')) {
            const cleanArticle = href.replace('./', '');
            anchor.removeAttribute('href');
            anchor.setAttribute('onclick', `navigate('${cleanArticle}')`);
          } else {
            anchor.removeAttribute('href');
            anchor.classList.add('disabled-link');
          }
        });

        container.innerHTML = doc.body.innerHTML;
        window.scrollTo(0, 0);

        if (title.toLowerCase().replace(/_/g, ' ') === targetArticle.toLowerCase().replace(/_/g, ' ')) {
          triggerVictory();
        }
      } catch (e) {
        container.innerHTML = "<p class='text-red-500'>Error retrieving Wikipedia entry.</p>";
      }
    }

    function navigate(nextTitle) {
      clicks++;
      route.push(nextTitle);
      document.getElementById('hud-clicks').innerText = clicks;
      currentArticle = nextTitle;
      fetchArticle(nextTitle);

      if (roomId) {
        socket.emit('player_navigated', { roomId, newPage: nextTitle, timeSeconds: secondsElapsed });
      }
    }

    // ANTI-CHEAT ENFORCEMENTS
    window.addEventListener('keydown', (e) => {
      if (banCtrlF && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') {
        e.preventDefault();
        alert("Ctrl+F search is prohibited!");
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden && banTabSwitch) {
        if (roomId) socket.emit('violation_tab_switch', { roomId });
        alert("Tab switched or minimized! Match forfeited.");
        window.location.href = '/';
      }
    });

    // MOBILE TOUCH ANTI-CHEAT (Neutralize long press & context menu)
    if (banNewTabs) {
      const container = document.getElementById('wiki-body');
      
      container.addEventListener('contextmenu', (e) => {
        if (e.target.closest('a')) e.preventDefault();
      });

      container.addEventListener('auxclick', (e) => {
        if (e.target.closest('a') && e.button === 1) e.preventDefault();
      });

      container.addEventListener('click', (e) => {
        if (e.target.closest('a') && (e.ctrlKey || e.metaKey || e.shiftKey)) {
          e.preventDefault();
        }
      }, true);
    }

    async function triggerVictory() {
      clearInterval(timer);
      document.getElementById('win-clicks').innerText = clicks;
      document.getElementById('win-time').innerText = document.getElementById('hud-timer').innerText;
      document.getElementById('win-modal').classList.remove('hidden');

      const token = localStorage.getItem('wikisprint_token');
      if (!token) return;

      if (mode === 'daily') {
        await fetch('/api/daily-submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': token },
          body: JSON.stringify({ clicks, timeSeconds: secondsElapsed, route })
        });
      } else {
        await fetch('/api/match-finish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': token },
          body: JSON.stringify({ won: true, exp: mode === 'multiplayer' ? 100 : 50 })
        });
      }
    }

    if (roomId) {
      document.getElementById('hud-opponents').classList.remove('hidden');
      const token = localStorage.getItem('wikisprint_token');
      socket.emit('join_room', { roomId, token });

      socket.on('race_progress', (data) => {
        const ticker = document.getElementById('opponents-ticker');
        ticker.innerHTML = `<span class="bg-gray-100 border border-gray-300 px-1 rounded">${data.username}: ${data.clicks}c</span>`;
      });

      socket.on('player_finished_run', (data) => {
        const standingsDiv = document.getElementById('multiplayer-standings');
        standingsDiv.classList.remove('hidden');
        document.getElementById('standings-rows').innerHTML = data.standings.map((p, idx) => `
          <div>#${idx + 1} <b>${p.username}</b> — ${p.clicks} clicks (${Math.floor(p.timeSeconds/60)}:${String(p.timeSeconds%60).padStart(2,'0')})</div>
        `).join('');
      });
    }

    startTimer();
    fetchArticle(currentArticle);
  </script>
</body>
</html>
