<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WikiSprint — Racing...</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    /* Clean Wikipedia-like article rendering */
    #wiki-body a { color: #3366cc; text-decoration: none; cursor: pointer; }
    #wiki-body a:hover { text-decoration: underline; }
    #wiki-body p { margin-bottom: 0.85rem; line-height: 1.6; }
    #wiki-body h2 { font-family: Georgia, serif; font-size: 1.4rem; border-bottom: 1px solid #c8ccd1; margin-top: 1.5rem; margin-bottom: 0.5rem; }
    #wiki-body h3 { font-family: Georgia, serif; font-size: 1.15rem; margin-top: 1.2rem; margin-bottom: 0.4rem; }
    #wiki-body ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 0.8rem; }
    #wiki-body table { border: 1px solid #a2a9b1; margin-bottom: 1rem; font-size: 0.85rem; border-collapse: collapse; }
    #wiki-body th, #wiki-body td { border: 1px solid #c8ccd1; padding: 0.3rem 0.6rem; }
  </style>
</head>
<body class="bg-[#f8f9fa] text-[#202122] min-h-screen flex flex-col font-sans select-none">

  <!-- HUD Bar -->
  <header class="sticky top-0 z-40 bg-white border-b border-[#a2a9b1] px-4 py-2 flex items-center justify-between text-xs shadow-sm">
    <div class="flex items-center gap-2">
      <span class="font-bold text-[#54595d] uppercase text-[10px]">GOAL:</span>
      <span id="hud-target" class="font-serif text-sm font-bold text-[#3366cc]"></span>
    </div>

    <div class="flex items-center gap-6 font-mono text-xs">
      <div>CLICKS: <span id="hud-clicks" class="font-bold text-sm">0</span></div>
      <div>TIME: <span id="hud-timer" class="font-bold text-sm">00:00</span></div>
    </div>

    <!-- Multiplayer Opponent Progress -->
    <div id="hud-opponents" class="hidden flex items-center gap-2 font-mono text-[11px]">
      <span class="text-[#54595d]">Racers:</span>
      <div id="opponents-ticker" class="flex gap-2"></div>
    </div>
  </header>

  <!-- Wikipedia Reader Body -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-6 md:p-10 bg-white border-x border-[#c8ccd1] my-4">
    <h1 id="article-header" class="font-serif text-3xl pb-2 border-b border-[#c8ccd1] mb-4">Loading article...</h1>
    <div id="wiki-body" class="text-sm"></div>
  </main>

  <!-- VICTORY MODAL -->
  <div id="win-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white border border-[#a2a9b1] max-w-sm w-full p-6 text-center shadow-2xl">
      <span class="text-4xl block mb-2">🏆</span>
      <h2 class="font-serif text-2xl font-bold mb-1">Target Reached!</h2>
      <p class="text-xs text-[#54595d] mb-4">You navigated to the destination article.</p>

      <div class="grid grid-cols-2 gap-2 text-xs border border-[#c8ccd1] p-3 mb-4 font-mono">
        <div>CLICKS: <b id="win-clicks">0</b></div>
        <div>TIME: <b id="win-time">00:00</b></div>
      </div>

      <div id="win-exp-tag" class="bg-emerald-50 text-emerald-700 border border-emerald-300 text-xs font-bold py-1.5 mb-4">
        +250 EXP Gained!
      </div>

      <button onclick="window.location.href='/'" class="w-full bg-[#3366cc] text-white text-xs font-semibold py-2 rounded-sm">
        Return to Lobby
      </button>
    </div>
  </div>

  <script>
    const socket = io();
    const params = new URLSearchParams(window.location.search);
    const mode = params.get('mode') || 'daily';
    let currentArticle = params.get('start') || 'The_Great_Barrier_Reef';
    const targetArticle = params.get('target') || 'Quantum_computing';
    const roomId = params.get('room');
    const attempt = parseInt(params.get('attempt') || '1', 10);

    const banCtrlF = params.get('ctrlF') !== 'false';
    const banTabSwitch = params.get('tabSwitch') !== 'false';

    let clicks = 0;
    let secondsElapsed = 0;
    let timer = null;
    let route = [currentArticle];

    document.getElementById('hud-target').innerText = decodeURIComponent(targetArticle).replace(/_/g, ' ');

    function startTimer() {
      timer = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('hud-timer').innerText = `${mins}:${secs}`;
      }, 1000);
    }

    // Load Article directly from Wikipedia API
    async function fetchArticle(title) {
      document.getElementById('article-header').innerText = decodeURIComponent(title).replace(/_/g, ' ');
      const container = document.getElementById('wiki-body');
      container.innerHTML = "<p class='italic text-gray-500'>Accessing Wikimedia archive...</p>";

      try {
        const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/html/${encodeURIComponent(title)}`);
        const html = await res.text();

        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');

        // Rewrite internal links
        doc.querySelectorAll('a').forEach(anchor => {
          const href = anchor.getAttribute('href');
          if (href && href.startsWith('./') && !href.includes(':')) {
            const next = href.replace('./', '');
            anchor.removeAttribute('href');
            anchor.setAttribute('onclick', `navigate('${next}')`);
          } else {
            anchor.removeAttribute('href');
            anchor.classList.add('text-gray-400', 'cursor-not-allowed');
          }
        });

        container.innerHTML = doc.body.innerHTML;
        window.scrollTo(0, 0);

        // Win check
        if (title.toLowerCase().replace(/_/g, ' ') === targetArticle.toLowerCase().replace(/_/g, ' ')) {
          triggerVictory();
        }
      } catch (e) {
        container.innerHTML = "<p class='text-red-500'>Could not load article.</p>";
      }
    }

    function navigate(nextTitle) {
      clicks++;
      route.push(nextTitle);
      document.getElementById('hud-clicks').innerText = clicks;
      currentArticle = nextTitle;
      fetchArticle(nextTitle);

      if (roomId) {
        socket.emit('player_navigated', { roomId, newPage: nextTitle });
      }
    }

    // Anti-Cheat: Ctrl+F & Focus loss
    window.addEventListener('keydown', (e) => {
      if (banCtrlF && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') {
        e.preventDefault();
        alert("Ctrl+F search is forbidden in this game!");
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden && banTabSwitch) {
        if (roomId) socket.emit('violation_tab_switch', { roomId });
        alert("Tab switched! Attempt forfeited.");
        window.location.href = '/';
      }
    });

    // Handle Victory & EXP awarding
    async function triggerVictory() {
      clearInterval(timer);
      document.getElementById('win-clicks').innerText = clicks;
      document.getElementById('win-time').innerText = document.getElementById('hud-timer').innerText;
      document.getElementById('win-modal').classList.remove('hidden');

      // Update User Profile
      const rawUser = localStorage.getItem('wikisprint_user');
      if (rawUser) {
        const user = JSON.parse(rawUser);
        const expGained = mode === 'daily' ? 250 : mode === 'multiplayer' ? 100 : 50;
        user.exp += expGained;
        
        if (mode === 'daily') user.streak += 1;
        if (mode === 'multiplayer') user.wins += 1;

        // Level Up check (every 500 * level EXP)
        if (user.exp >= user.level * 500) {
          user.exp -= user.level * 500;
          user.level += 1;
        }
        localStorage.setItem('wikisprint_user', JSON.stringify(user));

        // Submit daily run to server leaderboard
        if (mode === 'daily') {
          await fetch('/api/daily-submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: user.username,
              clicks,
              timeSeconds: secondsElapsed,
              attempt,
              route
            })
          });
        }
      }
    }

    // Multiplayer Socket Connections
    if (roomId) {
      document.getElementById('hud-opponents').classList.remove('hidden');
      const user = JSON.parse(localStorage.getItem('wikisprint_user') || '{"username":"Guest"}');
      socket.emit('join_room', { roomId, username: user.username });

      socket.on('race_progress', (data) => {
        const ticker = document.getElementById('opponents-ticker');
        ticker.innerHTML = `<span class="bg-gray-100 border border-gray-300 px-1 py-0.5 rounded">${data.username}: ${data.clicks} clicks</span>`;
      });

      socket.on('player_won', (data) => {
        alert(`${data.username} reached the target in ${data.clicks} clicks!`);
      });
    }

    startTimer();
    fetchArticle(currentArticle);
  </script>
</body>
</html>
